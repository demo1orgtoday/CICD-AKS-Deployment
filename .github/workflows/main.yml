name: Deploy CICD with AKS
on:
  push:
    branches:
      - main
env:
    IMAGE_NAME: 'myapp'
jobs:
  deploy-on-aks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login into Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: 
            az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.ACR_NAME}}.azurecr.io/${{ env.IMAGE_NAME }} .
          docker push ${{ secrets.ACR_NAME}}.azurecr.io/${{ env.IMAGE_NAME }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy to AKS
        run: |
          
          kubectl create -f deployment.yml
          kubectl set image deployment/myapp-deployment myapp=${{ secrets.ACR_NAME}}.azurecr.io/${{ env.IMAGE_NAME }}
